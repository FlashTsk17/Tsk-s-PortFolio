            widget: "list"
            summary: "{{fields.project}}"
            required: false
            fields:
              - {label: "Projet associé", name: "project", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Légende FR", name: "caption_fr", widget: "string"}
              - {label: "Caption EN", name: "caption_en", widget: "string"}
              - {label: "Texte alternatif FR", name: "alt_fr", widget: "string"}
